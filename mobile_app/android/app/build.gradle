plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'

android {
    namespace "com.dukaanflow.app"
    // No NDK is required: every ShopZen plugin (dio, riverpod, mobile_scanner,
    // secure storage, etc.) is pure Dart/Kotlin — no C/C++ sources. Omitting
    // ndkVersion avoids AGP trying to auto-download a ~700MB NDK that this
    // project never uses.
    compileSdk 36  // file_picker 8.x AAR requires API 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.dukaanflow.app"
        // ShopZen — Sell. Stock. Khata. Profit. Simplified.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // Debug signing lets the APK install immediately for testing.
            // For Play Store: create a keystore + android/key.properties and
            // reference it here (see docs/INSTALLATION_GUIDE.md).
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
