org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Built-in Kotlin: AGP 9 applies the Kotlin plugin itself; false keeps the
# classic `org.jetbrains.kotlin.android` declaration in settings.gradle.
# These flags ship with the official Flutter 3.47.x Android template.
android.builtInKotlin=false
# Read the classic (Groovy/legacy) DSL instead of the AGP 9-only new DSL.
android.newDsl=false
