name: dukaanflow
description: "ShopZen — Sell. Stock. Khata. Profit. Simplified. Mobile shop management for Indian retailers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Storage & Offline Persistence
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Formatting & Date (0.20.x required by flutter_localizations on recent Flutter)
  intl: any

  # UI & Icons
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1

  # Utilities & Deep Linking
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  mobile_scanner: ^5.1.1
  open_filex: ^4.4.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
